<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raxoi – Gourmet Kitchen</title>
  <style>
    :root {
      --primary: #9b2626;
      --dark: #2c3e50;
      --light: #fffaf5;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #fffaf5, #f8e8d8);
      color: #333;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .logo {
      text-align: center;
      margin: 40px 0 20px;
    }

    .logo img {
      max-width: 290px;
      height: auto;
      filter: drop-shadow(0 15px 30px rgba(155, 38, 38, 0.2));
    }

    .tagline {
      text-align: center;
      font-size: 1.15rem;
      color: #444;
      margin-bottom: 45px;
      font-weight: 700;           /* Made Bold */
      letter-spacing: 0.5px;
    }

    .branch {
      background: white;
      border-radius: 24px;
      padding: 35px 25px;
      margin-bottom: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
      text-align: center;
    }

    .branch h2 {
      margin: 0 0 25px 0;
      color: var(--dark);
      font-size: 1.8rem;
      font-weight: 700;
    }

    .order-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin: 25px 0;
    }

    .order-buttons a {
      padding: 16px 24px;
      background: var(--primary);
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.08rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 160px;
      justify-content: center;
      box-shadow: 0 6px 15px rgba(155, 38, 38, 0.25);
    }

    .order-buttons a:hover {
      background: #7a1e1e;
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(155, 38, 38, 0.4);
    }

    .map-link {
      color: #2980b9;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      font-size: 1.05rem;
    }

    .insta {
      text-align: center;
      margin-top: 55px;
      padding: 20px;
    }

    .insta a {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.25rem;
    }

    .insta img {
      height: 38px;
    }

    @media (max-width: 480px) {
      .logo img { max-width: 240px; }
      .branch { padding: 25px 20px; }
      .order-buttons a { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="raxoinewlogo.svg" alt="Raxoi Logo" />
    </div>

    <p class="tagline">
      Made Fresh Daily • No Preservatives • Highest Hygiene Standards
    </p>

    <div class="branch">
      <h2>📍 Kompally</h2>
      
      <div class="order-buttons">
        <a href="https://wa.me/919133323482?text=Hi%20Raxoi%20Kompally%2C%0A%0AI%20would%20like%20to%20place%20an%20order.%20Please%20share%20your%20menu%20and%20today%27s%20specials." target="_blank">
          💬 WhatsApp to Order
        </a>
        <a href="https://zomato.onelink.me/xqzv/p0ry5h3v" target="_blank">
          🍽️ Order on Zomato
        </a>
        <a href="https://www.swiggy.com/city/hyderabad/raxoi-alwal-rest1058653" target="_blank">
          🚀 Order on Swiggy
        </a>
      </div>

      <a class="map-link" href="https://maps.app.goo.gl/HDnoLZKhL6D8iKXB6" target="_blank">
        📍 View on Google Maps
      </a>
    </div>

    <div class="insta">
      <a href="https://www.instagram.com/raxoigourmetkitchen" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram"/>
        Follow us @raxoigourmetkitchen
      </a>
    </div>
  </div>
</body>
</html>
