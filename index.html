<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raxoi – Gourmet Kitchen</title>
  <style>
    :root {
      --primary: #9b2626;
      --dark: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #fffaf5;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .logo {
      text-align: center;
      margin: 40px 0 30px;
    }

    .logo img {
      max-width: 280px;
      height: auto;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.12));
    }

    h1 {
      text-align: center;
      font-size: 2.7rem;
      color: var(--dark);
      margin: 10px 0 8px;
      font-weight: 700;
    }

    .tagline {
      text-align: center;
      font-size: 1.25rem;
      color: #555;
      margin-bottom: 45px;
    }

    .branch {
      background: white;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin: 20px 0;
    }

    .links a {
      padding: 14px 26px;
      background: var(--primary);
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .links a:hover {
      background: #7a1e1e;
      transform: translateY(-3px);
    }

    .map-link {
      color: #2980b9;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .insta {
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="raxoinewlogo.svg" alt="Raxoi Logo" />
    </div>

    <h1>Raxoi</h1>
    <p class="tagline">Gourmet Kitchen • Order Near You</p>

    <div class="branch">
      <h2>📍 Kompally</h2>
      <div class="links">
        <a href="https://zomato.onelink.me/xqzv/p0ry5h3v" target="_blank">🍽️ Order on Zomato</a>
        <a href="https://www.swiggy.com/city/hyderabad/raxoi-alwal-rest1058653" target="_blank">🚀 Order on Swiggy</a>
      </div>
      <a class="map-link" href="https://maps.app.goo.gl/HDnoLZKhL6D8iKXB6" target="_blank">
        📍 View on Google Maps
      </a>
    </div>

    <div class="insta">
      <a href="https://www.instagram.com/raxoigourmetkitchen" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram"/>
        Follow us @raxoigourmetkitchen
      </a>
    </div>
  </div>
</body>
</html>
