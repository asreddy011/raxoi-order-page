<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raxoi – Order Near You</title>
  <style>
    :root {
      --primary: #e74c3c;
      --dark: #2c3e50;
      --light: #fffaf5;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: var(--light);
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .logo {
      text-align: center;
      margin: 30px 0 40px;
    }

    .logo img {
      max-width: 180px;
      height: auto;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      color: var(--dark);
      margin-bottom: 10px;
      font-size: 2.2rem;
    }

    .tagline {
      text-align: center;
      color: #666;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    .branch {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #eee;
    }

    .branch h2 {
      margin: 0 0 15px 0;
      color: var(--dark);
      font-size: 1.5rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 15px 0;
    }

    .links a {
      padding: 12px 20px;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }

    .links a:hover {
      background: #c0392b;
      transform: translateY(-2px);
    }

    .map-link {
      color: #2980b9;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .insta {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
    }

    .insta a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #c0392b;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .insta img {
      height: 32px;
    }

    @media (max-width: 480px) {
      body { padding: 15px; }
      .logo img { max-width: 140px; }
      h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="raxoi-logo.png" alt="Raxoi Logo" />
    </div>

    <h1>Raxoi</h1>
    <p class="tagline">Gourmet Kitchen • Order Near You</p>

    <div class="branch">
      <h2>📍 Kompally</h2>
      <div class="links">
        <a href="https://zomato.onelink.me/xqzv/p0ry5h3v" target="_blank">🍽️ Order on Zomato</a>
        <a href="https://www.swiggy.com/city/hyderabad/raxoi-alwal-rest1058653" target="_blank">🚀 Order on Swiggy</a>
      </div>
      <a class="map-link" href="https://maps.app.goo.gl/HDnoLZKhL6D8iKXB6" target="_blank">
        📍 View on Google Maps
      </a>
    </div>

    <div class="insta">
      <a href="https://www.instagram.com/raxoigourmetkitchen" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram"/>
        Follow us @raxoigourmetkitchen
      </a>
    </div>
  </div>
</body>
</html>
